name: Feature request
description: Suggest an improvement or new capability.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do that Meero makes hard or impossible today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What should happen instead? Sketch the UX or the API if you can.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you thought about, and why you'd rule them out.
  - type: checkboxes
    id: constraints
    attributes:
      label: Constraints check
      description: Meero has some hard invariants (see AGENTS.md). Confirm your idea fits.
      options:
        - label: It does not require mocking, faking, or simulating any pipeline stage.
        - label: It does not weaken a generated-app security validator or the required badge / error reporter.
        - label: It keeps the service-role key out of the browser and out of pushed source.
