# Meero frontend — reverse proxy to the `web` container.
#
# Install: sudo cp deploy/nginx/meero.im.conf /etc/nginx/sites-available/
#          sudo ln -s /etc/nginx/sites-available/meero.im.conf /etc/nginx/sites-enabled/
#          sudo nginx -t && sudo systemctl reload nginx
# Then run `sudo certbot --nginx -d meero.im -d www.meero.im` — certbot
# edits this file in place to add the 443 server block + http->https
# redirect. Don't hand-add TLS directives here; let certbot do it.
#
# Assumes docker-compose.yml is running with BIND_ADDR=127.0.0.1 (the
# Makefile does this automatically for APP_ENV=prod) — i.e. port 3000 is
# reachable from the VPS itself, not the public internet directly.

server {
    listen 80;
    listen [::]:80;
    server_name meero.im www.meero.im;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Supabase's session cookies (esp. after adding an OAuth provider —
        # PKCE code-verifier cookie stacks on top of the, sometimes
        # chunked, sb-*-auth-token cookies) can push response headers past
        # nginx's small default proxy buffers, which nginx reports as
        # "upstream sent too big header" rather than anything cookie-shaped.
        proxy_buffer_size 16k;
        proxy_buffers 4 32k;
        proxy_busy_buffers_size 64k;
    }
}
