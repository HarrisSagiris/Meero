# Meero orchestrator — reverse proxy to the `api` container.
#
# Install: sudo cp deploy/nginx/api.meero.im.conf /etc/nginx/sites-available/
#          sudo ln -s /etc/nginx/sites-available/api.meero.im.conf /etc/nginx/sites-enabled/
#          sudo nginx -t && sudo systemctl reload nginx
# Then run `sudo certbot --nginx -d api.meero.im` — certbot edits this file
# in place to add the 443 server block + http->https redirect, preserving
# the location blocks below. Don't hand-add TLS directives here.
#
# Assumes docker-compose.yml is running with BIND_ADDR=127.0.0.1 (the
# Makefile does this automatically for APP_ENV=prod) — i.e. port 8000 is
# reachable from the VPS itself, not the public internet directly. Also
# assumes the api container runs with --proxy-headers --forwarded-allow-ips=*
# (docker-compose.prod.yml) — without it, every request would look like it
# came from nginx's own address, breaking rate_limit.py's real per-client
# IP buckets.

server {
    listen 80;
    listen [::]:80;
    server_name api.meero.im;

    # Chat attachments / larger request bodies. Generated app assets never
    # pass through here — they're served straight from Supabase Storage to
    # the browser and don't touch the orchestrator.
    client_max_body_size 10m;

    # Real build-status WebSocket (GET /ws/projects/{id} in app/main.py) —
    # a long-lived connection, not a normal request/response, so it needs
    # the Upgrade handshake and much longer read/send timeouts than
    # everything else on this domain.
    location /ws/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Real token-by-token SSE reply (POST /chat/stream in app/main.py) —
    # must reach the browser as the model generates it. Buffering or
    # gzip-ing this would make the whole reply appear at once instead of
    # streaming, defeating the entire point of the endpoint.
    location /chat/stream {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        proxy_read_timeout 300s;
    }

    # Everything else: REST endpoints, and /preview/{build_id}/... — the
    # proxy that serves every generated app's real built HTML/JS/CSS.
    #
    # Do NOT add X-Frame-Options / frame-ancestors / any "hardening" header
    # snippet that blocks framing on this server block. The builder on
    # meero.im legitimately iframes /preview/{id}/... from THIS origin —
    # a frame-deny header here would break every single live app preview.
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
